apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-editor
  labels: { app: pdf-editor }
spec:
  replicas: 1
  selector:
    matchLabels: { app: pdf-editor }
  template:
    metadata:
      labels: { app: pdf-editor }
    spec:
      imagePullSecrets:
        - name: gcr-json-key
      containers:
        - name: pdf-editor
          image: us-central1-docker.pkg.dev/mizan-ai-kalimi03/mizan-images/pdf-editor:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 8006 }]
          env:
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: mizan-secrets, key: JWT_SECRET } }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "400Mi" }
          readinessProbe:
            tcpSocket: { port: 8006 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 8006 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pdf-editor
spec:
  selector: { app: pdf-editor }
  ports:
    - { port: 8006, targetPort: 8006 }
