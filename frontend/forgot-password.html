<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mizan.ai — Forgot password</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body>
<div class="mz-auth-shell">
  <div class="mz-auth-logo">
    <svg class="mz-logo-icon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="3" x2="12" y2="19"/>
      <line x1="5" y1="7" x2="19" y2="7"/>
      <path d="M5 7l-2.5 5a2.5 2.5 0 0 0 5 0L5 7z"/>
      <path d="M19 7l-2.5 5a2.5 2.5 0 0 0 5 0L19 7z"/>
      <line x1="8" y1="20" x2="16" y2="20"/>
    </svg>
    <span class="mz-wordmark"><span class="mz-wordmark-main">Mizan</span><span class="mz-wordmark-suffix">.ai</span></span>
    <span class="mz-wordmark-ar" dir="rtl" lang="ar">ميزان</span>
  </div>
  <div class="mz-card">
    <h2>Forgot password</h2>
    <p style="font-size:14px; color:var(--text-muted);">
      Enter your email and, if it's registered, we'll send a temporary password.
    </p>
    <form id="forgot-form">
      <label for="email">Email</label>
      <input type="email" id="email" required>
      <button type="submit" style="width:100%; margin-top:1.25rem;">Send temporary password</button>
    </form>
    <p class="mz-status" id="message" style="display:none;"></p>
    <p style="font-size:14px; margin-top:1rem;">
      <a href="login.html">Back to log in</a>
    </p>
  </div>
</div>
<script>
document.getElementById("forgot-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value;
  const messageEl = document.getElementById("message");

  try {
    const response = await fetch(MIZAN_CONFIG.chatbot + "/api/auth/forgot-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email }),
    });
    const data = await response.json();
    // Backend always returns the same generic message whether or not the
    // email is registered, on purpose (never reveal which accounts exist).
    messageEl.textContent = data.message;
    messageEl.style.display = "block";
  } catch (err) {
    messageEl.textContent = "Could not reach the server. Is it running?";
    messageEl.style.display = "block";
  }
});
</script>
</body>
</html>
