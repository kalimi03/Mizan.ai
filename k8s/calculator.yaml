apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator
  labels: { app: calculator }
spec:
  replicas: 1
  selector:
    matchLabels: { app: calculator }
  template:
    metadata:
      labels: { app: calculator }
    spec:
      imagePullSecrets:
        - name: gcr-json-key
      containers:
        - name: calculator
          image: mizanai-calculator:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8002 }]
          env:
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: mizan-config, key: DB_HOST } }
            - name: DB_PORT
              valueFrom: { configMapKeyRef: { name: mizan-config, key: DB_PORT } }
            - name: DB_NAME
              valueFrom: { configMapKeyRef: { name: mizan-config, key: DB_NAME } }
            - name: DB_USER
              valueFrom: { configMapKeyRef: { name: mizan-config, key: DB_USER } }
            - name: LANGCHAIN_TRACING_V2
              valueFrom: { configMapKeyRef: { name: mizan-config, key: LANGCHAIN_TRACING_V2 } }
            - name: LANGCHAIN_PROJECT
              valueFrom: { configMapKeyRef: { name: mizan-config, key: LANGCHAIN_PROJECT } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: mizan-secrets, key: DB_PASSWORD } }
            - name: MIZAN_QWEN_BRAIN_URL
              valueFrom: { secretKeyRef: { name: mizan-secrets, key: MIZAN_QWEN_BRAIN_URL } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: mizan-secrets, key: JWT_SECRET } }
            - name: LANGCHAIN_API_KEY
              valueFrom: { secretKeyRef: { name: mizan-secrets, key: LANGCHAIN_API_KEY } }
            # In-cluster peers -- Service names below, matching how
            # docker-compose pointed at sibling container names directly.
            - name: MIZAN_TRANSLATOR_INTERNAL_URL
              value: "http://translator:8003/internal/translate"
            - name: MIZAN_DOC_EXTRACTION_URL
              value: "http://doc-extraction:8001"
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "400Mi" }
          readinessProbe:
            tcpSocket: { port: 8002 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 8002 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: calculator
spec:
  selector: { app: calculator }
  ports:
    - { port: 8002, targetPort: 8002 }
