apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot
  labels: { app: chatbot }
spec:
  replicas: 1
  selector:
    matchLabels: { app: chatbot }
  template:
    metadata:
      labels: { app: chatbot }
    spec:
      imagePullSecrets:
        - name: gcr-json-key
      containers:
        - name: chatbot
          image: mizanai-chatbot:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          env:
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: mizan-config, key: DB_HOST } }
            - name: DB_PORT
              valueFrom: { configMapKeyRef: { name: mizan-config, key: DB_PORT } }
            - name: DB_NAME
              valueFrom: { configMapKeyRef: { name: mizan-config, key: DB_NAME } }
            - name: DB_USER
              valueFrom: { configMapKeyRef: { name: mizan-config, key: DB_USER } }
            - name: LANGCHAIN_TRACING_V2
              valueFrom: { configMapKeyRef: { name: mizan-config, key: LANGCHAIN_TRACING_V2 } }
            - name: LANGCHAIN_PROJECT
              valueFrom: { configMapKeyRef: { name: mizan-config, key: LANGCHAIN_PROJECT } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: mizan-secrets, key: DB_PASSWORD } }
            - name: MIZAN_QWEN_LITE_URL
              valueFrom: { secretKeyRef: { name: mizan-secrets, key: MIZAN_QWEN_LITE_URL } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: mizan-secrets, key: JWT_SECRET } }
            - name: MAILGUN_API_KEY
              valueFrom: { secretKeyRef: { name: mizan-secrets, key: MAILGUN_API_KEY } }
            - name: MAILGUN_DOMAIN
              valueFrom: { secretKeyRef: { name: mizan-secrets, key: MAILGUN_DOMAIN } }
            - name: MAILGUN_FROM_EMAIL
              valueFrom: { secretKeyRef: { name: mizan-secrets, key: MAILGUN_FROM_EMAIL } }
            - name: LANGCHAIN_API_KEY
              valueFrom: { secretKeyRef: { name: mizan-secrets, key: LANGCHAIN_API_KEY } }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "400Mi" }
          readinessProbe:
            tcpSocket: { port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot
spec:
  selector: { app: chatbot }
  ports:
    - { port: 8000, targetPort: 8000 }
